<text class="t" x="320" y="566" text-anchor="middle">Firecrawl</text>
<text class="s" x="320" y="583" text-anchor="middle">papers index</text>
<rect class="live" x="430" y="540" width="150" height="60" rx="10"/>
<text class="t" x="505" y="566" text-anchor="middle">Gemini</text>
<text class="s" x="505" y="583" text-anchor="middle">2.5 Flash + grounding</text>
<text class="s" x="600" y="558">fast-follow:</text>
<text class="s" x="600" y="573">OpenAI DR</text>
