<text class="s" x="250" y="769" text-anchor="middle">prompt cache + voice_bible</text>
<text class="w" x="415" y="761">→ claims</text>

<rect class="box" x="100" y="808" width="300" height="54" rx="10"/>
<text class="t" x="250" y="830" text-anchor="middle">4 opcje decyzji + claims</text>
<text class="s" x="250" y="847" text-anchor="middle">Najszybsza · Najtansza · Upside · Pewnosc</text>
<text class="w" x="415" y="839">→ options</text>

<rect class="box" x="100" y="886" width="300" height="54" rx="10"/>
<text class="t" x="250" y="908" text-anchor="middle">RESPONSE + Telegram</text>
<text class="s" x="250" y="925" text-anchor="middle">agent_messages → klient</text>
<text class="w" x="415" y="917">→ agent_messages</text>

<rect class="live" x="100" y="952" width="16" height="12" rx="3"/>
<text class="s" x="122" y="962">wdrozone + guard</text>
<rect class="dim" x="250" y="952" width="16" height="12" rx="3"/>
<text class="s" x="272" y="962">fast-follow (DR, Manus)</text>
<text class="s" x="430" y="962">jedno zrodlo prawdy: PostgreSQL ags_crd</text>
</svg>
